<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contacto.css">
    <title>Contacto</title>
</head>
<body>
    <header>
        <h1>CONTACTO</h1>
        <p>Tu mensaje puede llegarle a Lionel Messi!!!</p>
    </header>
    <main>
        <section class="Formulario">
            <h2>Envíanos tu mensaje</h2>
            <form>
                <label>Nombre completo</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre">

                <label>Correo electrónico</label>
                <input type="email" id="correo" placeholder="Escribe tu correo">

                <label>Asunto</label>
                <input type="text" id="asunto" placeholder="Escribe el asunto">

                <label>Mensaje</label>
                <textarea id="mensaje" placeholder="Escribe tu mensaje"></textarea>

                <div class="Botones">
                    <button type="button" onclick="enviar()">Enviar</button>
                    <button type="reset">Borrar</button>
                    <button type="button" onclick="location.href='index.html'">Atrás</button>
                </div>
            </form>
        </section>
    </main>
    <script src="contacto.js"></script>
</body>
</html>
